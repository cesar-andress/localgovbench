global_policies:
  uk_object:
    source: UK-ATRS
    object_layer: search_api_slim
    rationale: >
      Corpus stores GOV.UK Search API metadata only (title, description, link,
      organisation_title, format, index, public_timestamp). This is not the full
      ATRS publication template.
  do_not_infer_missing_fields: true
  do_not_merge_similar_names: true
