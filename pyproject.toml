[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localgovbench"
version = "0.2.0"
description = "Research software for schema disclosure affordance and coding of public AI and algorithm registers (Disclosure Functions v1)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "César Andrés", email = "cesar.andress@ucjc.edu" }]
keywords = [
    "ai-governance",
    "public-sector",
    "algorithm-registers",
    "disclosure-affordance",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/cesar-andress/localgovbench"
Documentation = "https://github.com/cesar-andress/localgovbench/tree/main/docs"
Affordance = "https://github.com/cesar-andress/localgovbench/tree/main/localgovbench_measurement_validation/affordance"

[tool.setuptools.packages.find]
where = ["."]
include = ["localgovbench*"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "localgovbench_measurement_validation/affordance/tests",
    "localgovbench_measurement_validation/affordance/coding/tests",
    "localgovbench_measurement_validation/affordance/experiments/tests",
]
pythonpath = ["."]
markers = [
    "integration: tests requiring local external services such as Ollama",
]
addopts = "-m 'not integration'"
