[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localgovbench"
version = "0.1.0"
description = "Research framework and benchmark scaffolding for local AI governance in European public sector organizations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "César Andrés", email = "cesar.andress@ucjc.edu" }]
keywords = [
    "ai-governance",
    "public-sector",
    "benchmark",
    "european-union",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/cesar-andress/localgovbench"
Documentation = "https://github.com/cesar-andress/localgovbench/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["localgovbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests requiring local external services such as Ollama",
]
addopts = "-m 'not integration'"
