    dimension_id: technical_security
  - criterion_id: organizational_accountability
    dimension_id: organizational
  - criterion_id: organizational_ownership
    dimension_id: organizational
  - criterion_id: organizational_role_definition
    dimension_id: organizational
  - criterion_id: organizational_procurement_governance
    dimension_id: organizational
  - criterion_id: organizational_risk_ownership
    dimension_id: organizational
  - criterion_id: operational_monitoring
