# Delphi Round 1 — content validity for LocalGovBench v0.1 (25 criteria)
# Expert panel rates relevance, clarity, and Lawshe essentiality.
# NOT a public-document observability study.

schema_version: "1.0"
study_label: localgovbench_instrument_validation_redevelop
instrument_version: v0.1.0
instrument_id: localgovbench-v0.1
round: 1

validation_scope_guard:
  study_type: instrument_content_validity
  unit_of_evaluation: criterion_definitions
  not_primary_evidence:
    - public_document_observability
    - public_ai_registers
    - open_pilot

instructions: |
  Rate each criterion for assessing governance readiness of municipal LLM/AI programmes
  using confidential programme dossiers and evidence-gated assessor review.
  Do not rate public-register observability or transparency-portal coverage.
  Do not assign maturity scores for any municipality.

scales:
  relevance:
    range: [1, 5]
    labels:
      1: not relevant
      2: somewhat relevant
      3: moderately relevant
      4: relevant
      5: highly relevant
  clarity:
    range: [1, 5]
    labels:
      1: very unclear
      5: very clear
  essential_lawshe:
    type: boolean
    note: Lawshe essentiality for programme-level dossier assessment construct

criteria:
  - criterion_id: legal_regulatory_gdpr_readiness
    dimension_id: legal_regulatory
  - criterion_id: legal_regulatory_ai_act_alignment
    dimension_id: legal_regulatory
  - criterion_id: legal_regulatory_data_retention
    dimension_id: legal_regulatory
