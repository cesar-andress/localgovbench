instructions: |
  Apply LocalGovBench v0.1 to the confidential programme dossier only.
  Do not use public AI registers, transparency portals, or open-web corpora as evidence.
  If no dossier artefact supports a criterion, set score to withheld_no_evidence.
  Scores >= 3 require evidence_gate_status: pass with named artefact in span.

