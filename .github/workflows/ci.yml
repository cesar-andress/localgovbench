name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Repository validation
        run: python scripts/validate_repository.py
      - name: Corpus lock-only check
        run: python scripts/verify_pilot_corpus.py --lock-only
        # Justification: default CI must not require gitignored corpus bytes or network rebuilds.
      - name: Affordance + documentation + packaging tests
        run: |
          pytest localgovbench_measurement_validation/affordance \
            tests/test_active_documentation_claims.py \
            tests/test_version_consistency.py \
            tests/test_legacy_notices.py \
            -q
      - name: Clean-room check (git-alone)
        run: python scripts/run_clean_room_check.py --skip-tests
        # Tests already run above; this checks install/version/validator/corpus warn path.
